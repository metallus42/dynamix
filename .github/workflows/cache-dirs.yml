name: Cache Dirs pool standby
on:
  push:
    branches: [codex/cache-dirs-pool-idle]
  pull_request:
    paths: ['source/cache-dirs/**', 'tests/cache-dirs/**', 'archive/dynamix.cache.dirs.txz', 'unRAIDv6/dynamix.cache.dirs.plg', '.github/workflows/cache-dirs.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l source/cache-dirs/scripts/cache_dirs_state.php
          bash -n source/cache-dirs/scripts/cache_dirs
          php tests/cache-dirs/state.php
          python3 tests/cache-dirs/scans.py
          python3 tests/cache-dirs/build_package.py
          git diff --exit-code -- archive/dynamix.cache.dirs.txz unRAIDv6/dynamix.cache.dirs.plg
